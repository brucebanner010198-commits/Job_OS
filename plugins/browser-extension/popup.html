<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 14px;
        margin: 0;
        background: #09090b;
        color: #f4f4f5;
      }
      h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 6px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      p {
        font-size: 12px;
        color: #a1a1aa;
        margin: 0 0 12px;
        line-height: 1.4;
      }
      .status {
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 4px;
        margin-bottom: 12px;
        background: #27272a;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #10b981;
      }
      button {
        width: 100%;
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover {
        background: #2563eb;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <h1>Job OS Companion</h1>
    <p>Autofill this job application with your verified profile facts.</p>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="status-text">Connecting to Job OS...</span>
    </div>
    <button id="autofill-btn" disabled>Autofill Application</button>
    <script src="popup.js"></script>
  </body>
</html>
